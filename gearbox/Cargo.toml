[package]
name = "gearbox-rs"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
authors.workspace = true
description = "A lightweight Rust web framework with dependency injection"
readme = "../README.md"

[dependencies]
gearbox-rs-core = { path = "../core", version = "1.3.0" }
gearbox-rs-macros = { path = "../macros", version = "1.3.0" }

[features]
default = []
postgres = ["dep:gearbox-rs-postgres"]
testing = ["gearbox-rs-core/testing"]

[dependencies.gearbox-rs-postgres]
path = "../pg"
version = "1.3.0"
optional = true
