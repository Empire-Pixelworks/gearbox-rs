[workspace]
resolver = "3"
members = [
    "core",
    "pg",
    "macros",
    "examples/*"
]

[workspace.package]
version = "0.0.1"
edition = "2024"
repository = "https://github.com/Empire-Pixelworks/gearbox-rs"

[workspace.dependencies]
tokio = { version = "1.47" }
async-trait = "0.1"
dashmap = "6.1"
thiserror = "2.0"
tracing = "0.1"
axum = "0.8"
inventory = "0.3"
syn = { version = "2.0", features = ["full", "extra-traits"] }
quote = "1.0"
proc-macro2 = "1.0"