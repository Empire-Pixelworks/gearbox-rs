[package]
name = "gearbox-core"
version.workspace = true
edition.workspace = true
authors = ["Brandon Lanthrip <blanthrip@gmail.com>"]
description = "Core framework for Gearbox"

[dependencies]
async-trait = { workspace = true }
dashmap = { workspace = true }
